[tool.poetry]
name = "astrotrade-backend"
version = "0.1.0"
description = "AstroTrade FastAPI backend for interacting with on-chain smart contracts"
authors = ["Jerzy Janeczek"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
web3 = "^7.0.0"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
python-dotenv = "^1.0.0"
aiofiles = "^25.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
